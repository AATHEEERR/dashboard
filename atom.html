<title>مختبر الذرّة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: full-bleed WebGL stage; instrument panel docked at the reading start (right), periodic strip along the bottom. */
:root {
  --ink: #050816;        /* deep chamber background */
  --ink-2: #0c1230;      /* vignette core */
  --fg: #e6ecff;
  --muted: #8d97bf;
  --line: rgba(160, 178, 255, 0.16);
  --surface: rgba(10, 15, 38, 0.72);
  --proton: #ff7a45;
  --neutron: #9fb2d9;
  --electron: #8fefff;
  --orb-s: #7fe7ff;
  --orb-p: #a68bff;
  --orb-d: #ff7aa8;
  --orb-f: #ffc66b;
  --display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --body: "IBM Plex Sans Arabic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 45%, var(--ink-2) 0%, var(--ink) 60%);
  background-color: var(--ink);
  color: var(--fg);
  font-family: var(--body);
  overflow: hidden;
  direction: rtl;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }

.panel {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: calc(16px + env(safe-area-inset-right, 0px));
  width: 300px;
  padding: 18px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: grid;
  gap: 14px;
}
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; display: flex; justify-content: space-between; }
.ident { display: flex; align-items: center; gap: 16px; }
.sym {
  font-family: var(--mono); font-weight: 600; font-size: 56px; line-height: 1;
  color: var(--fg); direction: ltr;
  min-width: 2.4ch; text-align: center;
  padding: 8px 6px; border: 1px solid var(--line); border-radius: 4px;
  position: relative;
}
.sym::after { content: attr(data-z); position: absolute; top: 4px; left: 6px; font-size: 11px; font-weight: 400; color: var(--muted); }
.name { font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1.15; text-wrap: balance; }
.mass { font-size: 13px; color: var(--muted); margin-top: 4px; }
.mass span, .stats dd { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
.stats div { border-top: 1px solid var(--line); padding-top: 8px; }
.stats dt { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stats dd { margin: 2px 0 0; font-size: 22px; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.p { background: var(--proton); box-shadow: 0 0 8px var(--proton); }
.dot.n { background: var(--neutron); }
.dot.e { background: var(--electron); box-shadow: 0 0 8px var(--electron); }
.block h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }
.mono { font-family: var(--mono); font-size: 14px; line-height: 1.6; word-break: break-word; }
#shells { direction: ltr; text-align: right; font-size: 17px; letter-spacing: 0.04em; }
#shells b { color: var(--electron); font-weight: 600; }
#conf sup { font-size: 0.7em; color: var(--electron); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); }

.topbar {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: calc(16px + env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
}
.brand { font-family: var(--display); font-size: 20px; font-weight: 700; letter-spacing: 0.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); }
button {
  font: inherit; font-size: 13px; color: var(--fg); background: transparent;
  border: 0; padding: 8px 12px; cursor: pointer;
}
button:focus-visible, input:focus-visible { outline: 2px solid var(--electron); outline-offset: 2px; }
.seg button[aria-pressed="true"] { background: rgba(143, 239, 255, 0.14); color: var(--electron); }
.seg button + button { border-right: 1px solid var(--line); }
.ctl { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
.ctl input[type="range"] { width: 96px; accent-color: var(--electron); }
.ctl button { padding: 4px 4px; color: var(--fg); }

.strip {
  position: fixed;
  left: 0; right: 0;
  bottom: 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin;
  background: linear-gradient(to top, rgba(5, 8, 22, 0.92), rgba(5, 8, 22, 0));
}
.cell {
  flex: none; width: 52px; height: 58px; padding: 4px 6px;
  border: 1px solid var(--line); border-radius: 4px; background: var(--surface);
  display: grid; grid-template-rows: auto 1fr; text-align: left; direction: ltr;
  transition: border-color .2s, transform .2s;
}
.cell small { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.cell strong { font-family: var(--mono); font-size: 20px; font-weight: 600; align-self: center; text-align: center; }
.cell:hover { border-color: rgba(143, 239, 255, 0.5); transform: translateY(-2px); }
.cell[aria-current="true"] { border-color: var(--proton); box-shadow: 0 0 0 1px var(--proton) inset, 0 0 18px rgba(255, 122, 69, 0.35); }
.cell[aria-current="true"] strong { color: var(--proton); }
.hint {
  position: fixed; margin: 0;
  left: calc(16px + env(safe-area-inset-left, 0px));
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  font-size: 12px; color: var(--muted);
}

@media (max-width: 720px) {
  .panel {
    left: calc(12px + env(safe-area-inset-left, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px));
    top: calc(12px + env(safe-area-inset-top, 0px));
    width: auto; padding: 12px 14px; gap: 10px;
    grid-template-columns: auto 1fr; align-items: center;
  }
  .eyebrow, .conf-block, .legend { display: none; }
  .sym { font-size: 34px; }
  .name { font-size: 20px; }
  .ident { grid-column: 1; }
  .stats { grid-column: 2; }
  .stats dd { font-size: 17px; }
  .stats dt { font-size: 10px; }
  .shell-block { grid-column: 1 / -1; display: flex; gap: 10px; align-items: baseline; }
  .shell-block h3 { margin: 0; }
  #shells { font-size: 14px; }
  .topbar { top: auto; left: calc(12px + env(safe-area-inset-left, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); align-items: stretch; }
  .brand { display: none; }
  .controls { justify-content: space-between; }
  .hint { display: none; }
}
@media (max-width: 420px) {
  .ctl input[type="range"] { width: 70px; }
  .seg button { padding: 8px 9px; }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  // ---------- Data ----------
  const ELEMENTS = [
    { z: 1, s: 'H', n: 'هيدروجين', N: 0 },
    { z: 2, s: 'He', n: 'هيليوم', N: 2 },
    { z: 3, s: 'Li', n: 'ليثيوم', N: 4 },
    { z: 6, s: 'C', n: 'كربون', N: 6 },
    { z: 7, s: 'N', n: 'نيتروجين', N: 7 },
    { z: 8, s: 'O', n: 'أكسجين', N: 8 },
    { z: 10, s: 'Ne', n: 'نيون', N: 10 },
    { z: 11, s: 'Na', n: 'صوديوم', N: 12 },
    { z: 12, s: 'Mg', n: 'مغنيسيوم', N: 12 },
    { z: 13, s: 'Al', n: 'ألومنيوم', N: 14 },
    { z: 14, s: 'Si', n: 'سيليكون', N: 14 },
    { z: 17, s: 'Cl', n: 'كلور', N: 18 },
    { z: 18, s: 'Ar', n: 'أرغون', N: 22 },
    { z: 20, s: 'Ca', n: 'كالسيوم', N: 20 },
    { z: 26, s: 'Fe', n: 'حديد', N: 30 },
    { z: 29, s: 'Cu', n: 'نحاس', N: 35 },
    { z: 47, s: 'Ag', n: 'فضة', N: 61 },
    { z: 79, s: 'Au', n: 'ذهب', N: 118 },
    { z: 92, s: 'U', n: 'يورانيوم', N: 146 },
  ];
  // Real ground-state configurations that break the Aufbau order
  const EXCEPTIONS = { 29: { '3d': 10, '4s': 1 }, 47: { '4d': 10, '5s': 1 }, 79: { '5d': 10, '6s': 1 }, 92: { '5f': 3, '6d': 1 } };
  const ORDER = ['1s','2s','2p','3s','3p','4s','3d','4p','5s','4d','5p','6s','4f','5d','6p','7s','5f','6d','7p'];
  const CAP = { s: 2, p: 6, d: 10, f: 14 };
  const L = 'spdf';

  function configuration(z) {
    const map = new Map();
    let left = z;
    for (const o of ORDER) {
      if (left <= 0) break;
      const k = Math.min(CAP[o[1]], left);
      map.set(o, k); left -= k;
    }
    if (EXCEPTIONS[z]) for (const [o, k] of Object.entries(EXCEPTIONS[z])) map.set(o, k);
    return [...map].filter(([, k]) => k > 0)
      .map(([o, k]) => ({ o, n: +o[0], l: L.indexOf(o[1]), k }))
      .sort((a, b) => a.n - b.n || a.l - b.l);
  }
  const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const sup = (k) => String(k).split('').map((d) => SUP[d]).join('');

  // ---------- Scene ----------
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x050816, 0);
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 800);
  camera.position.set(6, 4, 14);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.enablePan = false;
  controls.minDistance = 3;
  controls.maxDistance = 140;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;

  scene.add(new THREE.AmbientLight(0x4a5a8a, 0.7));
  const key = new THREE.DirectionalLight(0xe4ecff, 1.15); key.position.set(5, 8, 6); scene.add(key);
  const rim = new THREE.DirectionalLight(0x7b6cff, 0.8); rim.position.set(-6, -3, -6); scene.add(rim);

  function radialTexture(stops) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    stops.forEach(([p, a]) => gr.addColorStop(p, `rgba(255,255,255,${a})`));
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  const GLOW = radialTexture([[0, 1], [0.15, 0.85], [0.4, 0.22], [1, 0]]);
  const DOT = radialTexture([[0, 1], [0.35, 0.7], [1, 0]]);

  // Faint particle-chamber dust
  {
    const n = 1400, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const v = randomUnit(), r = 160 + Math.random() * 200;
      pos.set([v.x * r, v.y * r, v.z * r], i * 3);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x8fa0d8, size: 1.4, sizeAttenuation: false, transparent: true, opacity: 0.55 })));
  }

  function randomUnit() {
    const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    return new THREE.Vector3(s * Math.cos(t), s * Math.sin(t), u);
  }

  // ---------- Nucleus ----------
  const RS = 0.42;
  function packNucleus(A) {
    if (A === 1) return [[0, 0, 0]];
    const R0 = RS * 1.3 * Math.cbrt(A);
    const p = [];
    for (let i = 0; i < A; i++) {
      const v = randomUnit().multiplyScalar(R0 * Math.cbrt(Math.random()));
      p.push([v.x, v.y, v.z]);
    }
    const d0 = RS * 1.85;
    for (let it = 0; it < 45; it++) {
      for (let i = 0; i < A; i++) {
        const a = p[i];
        for (let j = i + 1; j < A; j++) {
          const b = p[j];
          const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
          const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          if (d < d0 && d > 1e-6) {
            const f = (d0 - d) * 0.5 / d;
            a[0] -= dx * f; a[1] -= dy * f; a[2] -= dz * f;
            b[0] += dx * f; b[1] += dy * f; b[2] += dz * f;
          }
        }
      }
      for (const q of p) { q[0] *= 0.97; q[1] *= 0.97; q[2] *= 0.97; }
    }
    return p;
  }

  // ---------- Atom build ----------
  const SPHERE = new THREE.SphereGeometry(RS, 24, 16);
  const CORE = new THREE.SphereGeometry(0.11, 12, 8);
  const TRAIL_PTS = 30, TRAIL_ARC = 1.1;
  const ORB_COLORS = [0x7fe7ff, 0xa68bff, 0xff7aa8, 0xffc66b];
  let atom = null;

  function disposeTree(obj) {
    obj.traverse((o) => {
      if (o.geometry && o.geometry !== SPHERE && o.geometry !== CORE) o.geometry.dispose();
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
    });
  }

  function build(el) {
    if (atom) { scene.remove(atom.group); disposeTree(atom.group); }
    const conf = configuration(el.z);
    const A = el.z + el.N;
    const group = new THREE.Group();
    scene.add(group);

    // Nucleus as instanced spheres
    const pts = packNucleus(A);
    const order = pts.map((_, i) => i).sort(() => Math.random() - 0.5);
    const pMesh = new THREE.InstancedMesh(SPHERE, new THREE.MeshStandardMaterial({ color: 0xff7a45, emissive: 0x6a2008, roughness: 0.32, metalness: 0.08 }), el.z);
    const nMesh = el.N ? new THREE.InstancedMesh(SPHERE, new THREE.MeshStandardMaterial({ color: 0x9fb2d9, emissive: 0x0e1630, roughness: 0.42, metalness: 0.15 }), el.N) : null;
    const nucleons = order.map((idx, k) => ({
      base: pts[idx], mesh: k < el.z ? pMesh : nMesh, i: k < el.z ? k : k - el.z,
      ph: Math.random() * Math.PI * 2, fr: 6 + Math.random() * 5,
    }));
    let rc = RS;
    for (const q of pts) rc = Math.max(rc, Math.hypot(q[0], q[1], q[2]) + RS);
    const nucleus = new THREE.Group();
    nucleus.add(pMesh); if (nMesh) nucleus.add(nMesh);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0xff8a50, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
    halo.scale.setScalar(rc * 4.2 + 1.5);
    nucleus.add(halo);
    group.add(nucleus);

    // Bohr shells: electrons per principal level, big shells split into several orbital planes
    const shellCounts = [];
    conf.forEach((c) => { shellCounts[c.n - 1] = (shellCounts[c.n - 1] || 0) + c.k; });
    const radii = [];
    const bohr = new THREE.Group();
    group.add(bohr);
    const rings = [];
    let r = rc + 2.0;
    shellCounts.forEach((cnt, si) => {
      radii.push(r);
      const ringCount = Math.ceil(cnt / 8);
      const pivot = new THREE.Group();
      pivot.rotation.set(si * 0.9 + 0.4, si * 2.39996, 0);
      bohr.add(pivot);
      for (let ri = 0; ri < ringCount; ri++) {
        const n = Math.floor(cnt / ringCount) + (ri < cnt % ringCount ? 1 : 0);
        const tilt = new THREE.Group();
        tilt.rotation.set(0, (ri / ringCount) * Math.PI, ri * 0.35);
        pivot.add(tilt);

        const circ = [];
        for (let a = 0; a <= 128; a++) { const t = a / 128 * Math.PI * 2; circ.push(new THREE.Vector3(Math.cos(t) * r, Math.sin(t) * r, 0)); }
        tilt.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(circ),
          new THREE.LineBasicMaterial({ color: 0x6f86d6, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false })));

        const electrons = [];
        for (let k = 0; k < n; k++) {
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0x8fefff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
          sprite.scale.setScalar(1.15);
          const core = new THREE.Mesh(CORE, new THREE.MeshBasicMaterial({ color: 0xf2feff }));
          const tg = new THREE.BufferGeometry();
          tg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_PTS * 3), 3));
          const col = new Float32Array(TRAIL_PTS * 3);
          for (let j = 0; j < TRAIL_PTS; j++) {
            const f = Math.pow(1 - j / (TRAIL_PTS - 1), 1.6);
            col.set([0.56 * f, 0.94 * f, 1.0 * f], j * 3);
          }
          tg.setAttribute('color', new THREE.BufferAttribute(col, 3));
          const trail = new THREE.Line(tg, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
          tilt.add(trail, sprite, core);
          electrons.push({ sprite, core, trail, off: (k / n) * Math.PI * 2 + ri * 0.6 });
        }
        rings.push({
          tilt, r, electrons,
          speed: 1.25 / Math.pow(si + 1, 0.75),
          dir: (si + ri) % 2 ? -1 : 1,
        });
      }
      pivot.userData.prec = 0.05 + 0.03 * si;
      r += 1.6;
    });
    const outerR = radii[radii.length - 1];

    atom = { el, conf, group, nucleus, nucleons, pMesh, nMesh, halo, bohr, rings, radii, outerR, rc, cloud: null, born: performance.now() };
    if (mode === 'cloud') ensureCloud();
    applyMode();
    updatePanel();
    fitCamera();
  }

  // ---------- Quantum cloud ----------
  const ANG = [
    [() => 1],
    [(x) => x, (x, y) => y, (x, y, z) => z],
    [(x, y, z) => 3 * z * z - 1, (x, y, z) => x * z, (x, y, z) => y * z, (x, y) => x * y, (x, y) => x * x - y * y],
    [(x, y, z) => z * (5 * z * z - 3), (x, y, z) => x * (5 * z * z - 1), (x, y, z) => y * (5 * z * z - 1),
     (x, y, z) => z * (x * x - y * y), (x, y, z) => x * y * z, (x, y) => x * (x * x - 3 * y * y), (x, y) => y * (3 * x * x - y * y)],
  ];
  const ANG_MAX = ANG.map((fs) => fs.map((f) => {
    let m = 0;
    for (let i = 0; i < 6000; i++) { const v = randomUnit(); m = Math.max(m, f(v.x, v.y, v.z) ** 2); }
    return m;
  }));

  function ensureCloud() {
    if (atom.cloud) return;
    const PER_E = 1100, CAP_PTS = 52000;
    const scale = Math.min(1, CAP_PTS / (atom.el.z * PER_E));
    const pos = [], col = [];
    const c = new THREE.Color();
    for (const sub of atom.conf) {
      const m = 2 * sub.l + 1;
      const R = atom.radii[sub.n - 1];
      const shape = 4 * sub.n + 4, mean = shape; // gamma(k, 1): mean k, spread 1/sqrt(k)
      c.setHex(ORB_COLORS[sub.l]);
      for (let mi = 0; mi < m; mi++) {
        const occ = (sub.k > mi ? 1 : 0) + (sub.k > m + mi ? 1 : 0);
        const count = Math.round(occ * PER_E * scale);
        const f = ANG[sub.l][mi], fmax = ANG_MAX[sub.l][mi];
        for (let p = 0; p < count; p++) {
          let v;
          do { v = randomUnit(); } while (Math.random() * fmax > f(v.x, v.y, v.z) ** 2);
          let g = 0; for (let s = 0; s < shape; s++) g -= Math.log(Math.random() || 1e-9);
          const rr = R * g / mean;
          pos.push(v.x * rr, v.y * rr, v.z * rr);
          const b = 0.55 + Math.random() * 0.45;
          col.push(c.r * b, c.g * b, c.b * b);
        }
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    const pts = new THREE.Points(g, new THREE.PointsMaterial({
      size: 0.1 + atom.outerR * 0.016, map: DOT, vertexColors: true, transparent: true, opacity: 0.85,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    }));
    atom.cloud = pts;
    atom.group.add(pts);
  }

  // ---------- UI ----------
  let mode = 'bohr', paused = false, speed = 1, current = 14;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) { speed = 0.3; controls.autoRotate = false; }
  const $ = (id) => document.getElementById(id);
  $('speed').value = speed;

  const strip = $('strip');
  ELEMENTS.forEach((el, i) => {
    const b = document.createElement('button');
    b.className = 'cell'; b.id = 'el-' + el.s;
    b.innerHTML = `<small>${el.z}</small><strong>${el.s}</strong>`;
    b.title = el.n; b.setAttribute('aria-label', `${el.n}، العدد الذري ${el.z}`);
    b.addEventListener('click', () => select(i));
    strip.appendChild(b);
  });

  function select(i) {
    current = (i + ELEMENTS.length) % ELEMENTS.length;
    [...strip.children].forEach((b, k) => b.setAttribute('aria-current', k === current ? 'true' : 'false'));
    strip.children[current].scrollIntoView({ inline: 'center', block: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
    build(ELEMENTS[current]);
  }

  function updatePanel() {
    const { el, conf } = atom;
    $('zLbl').textContent = el.z;
    $('sym').textContent = el.s; $('sym').dataset.z = el.z;
    $('name').textContent = el.n;
    $('A').textContent = el.z + el.N;
    $('np').textContent = el.z; $('nn').textContent = el.N; $('ne').textContent = el.z;
    const shells = [];
    conf.forEach((c) => { shells[c.n - 1] = (shells[c.n - 1] || 0) + c.k; });
    $('shells').innerHTML = shells.map((s) => `<b>${s}</b>`).join(' · ');
    $('conf').innerHTML = conf.map((c) => `${c.n}${L[c.l]}<sup>${c.k}</sup>`).join(' ');
    const present = [...new Set(conf.map((c) => c.l))];
    const css = ['--orb-s', '--orb-p', '--orb-d', '--orb-f'];
    $('legend').innerHTML = present.map((l) => `<span><i class="dot" style="background:var(${css[l]});box-shadow:0 0 8px var(${css[l]})"></i>${L[l]}</span>`).join('') +
      '<span style="font-family:var(--body)">كثافة الاحتمال حسب نوع المدار</span>';
  }

  function applyMode() {
    $('mBohr').setAttribute('aria-pressed', mode === 'bohr');
    $('mCloud').setAttribute('aria-pressed', mode === 'cloud');
    $('modeLbl').textContent = mode === 'bohr' ? 'نموذج بور' : 'السحابة الكمّية';
    $('legend').hidden = mode !== 'cloud';
    if (!atom) return;
    atom.bohr.visible = mode === 'bohr';
    if (atom.cloud) atom.cloud.visible = mode === 'cloud';
    atom.nucleus.scale.setScalar(mode === 'cloud' ? 0.7 : 1);
  }
  $('mBohr').addEventListener('click', () => { mode = 'bohr'; applyMode(); });
  $('mCloud').addEventListener('click', () => { mode = 'cloud'; ensureCloud(); applyMode(); });
  $('speed').addEventListener('input', (e) => { speed = +e.target.value; });
  $('pause').addEventListener('click', () => {
    paused = !paused;
    $('pause').textContent = paused ? '▶' : '❚❚';
    $('pause').setAttribute('aria-label', paused ? 'تشغيل الحركة' : 'إيقاف الحركة');
    controls.autoRotate = !paused && !reduced;
  });
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') select(current + 1);
    if (e.key === 'ArrowRight') select(current - 1);
  });

  // ---------- Camera fit ----------
  let fit = null;
  function fitCamera() {
    const aspect = camera.aspect || 1;
    let d = atom.outerR * 2.7 + 4;
    if (aspect < 1) d /= Math.max(aspect, 0.5) * 1.05;
    fit = { from: camera.position.length(), to: d, t0: performance.now() };
  }
  controls.addEventListener('start', () => { fit = null; });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', () => { resize(); if (atom) fitCamera(); });
  resize();

  // ---------- Loop ----------
  const M = new THREE.Matrix4(), V = new THREE.Vector3();
  let last = performance.now(), t = 0;
  const easeOutBack = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; };

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const step = paused ? 0 : dt * speed;
    t += step;

    if (atom) {
      const age = Math.min(1, (now - atom.born) / 900);
      atom.group.scale.setScalar(Math.max(0.001, easeOutBack(age)));

      // nucleon vibration
      const amp = 0.035;
      for (const q of atom.nucleons) {
        const ph = q.ph + t * q.fr;
        V.set(q.base[0] + Math.sin(ph) * amp, q.base[1] + Math.cos(ph * 1.3) * amp, q.base[2] + Math.sin(ph * 0.7) * amp);
        M.makeTranslation(V.x, V.y, V.z);
        q.mesh.setMatrixAt(q.i, M);
      }
      atom.pMesh.instanceMatrix.needsUpdate = true;
      if (atom.nMesh) atom.nMesh.instanceMatrix.needsUpdate = true;
      atom.halo.material.opacity = 0.45 + Math.sin(now / 700) * 0.08;

      if (atom.bohr.visible) {
        atom.bohr.children.forEach((pivot) => { pivot.rotation.y += step * pivot.userData.prec * 4; });
        for (const ring of atom.rings) {
          const r = ring.r;
          for (const e of ring.electrons) {
            const th = e.off + t * ring.speed * ring.dir;
            const x = Math.cos(th) * r, y = Math.sin(th) * r;
            e.sprite.position.set(x, y, 0); e.core.position.set(x, y, 0);
            const arr = e.trail.geometry.attributes.position.array;
            for (let j = 0; j < TRAIL_PTS; j++) {
              const a = th - ring.dir * (j / (TRAIL_PTS - 1)) * TRAIL_ARC;
              arr[j * 3] = Math.cos(a) * r; arr[j * 3 + 1] = Math.sin(a) * r; arr[j * 3 + 2] = 0;
            }
            e.trail.geometry.attributes.position.needsUpdate = true;
          }
        }
      }
      if (atom.cloud && atom.cloud.visible) {
        atom.cloud.rotation.y += step * 0.15;
        atom.cloud.rotation.x = Math.sin(t * 0.2) * 0.15;
      }
    }

    if (fit) {
      const k = Math.min(1, (now - fit.t0) / 1200);
      const e = 1 - Math.pow(1 - k, 3);
      camera.position.setLength(fit.from + (fit.to - fit.from) * e);
      if (k >= 1) fit = null;
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  select(current);
  requestAnimationFrame(frame);
})();
</script>
