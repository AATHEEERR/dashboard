<title>مختبر الذرّة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed WebGL stage on a light lab ground; title block and controls at top-left, instrument panel at top-right, periodic strip along the bottom. */
:root {
  --bg: #f4f6fb;
  --bg-hi: #ffffff;
  --fg: #14213d;
  --muted: #5b6785;
  --line: rgba(20, 33, 61, 0.13);
  --surface: rgba(255, 255, 255, 0.88);
  --proton: #e11d48;
  --neutron: #2563eb;
  --accent: #14213d;
  --sh1: #0891b2; --sh2: #16a34a; --sh3: #d97706; --sh4: #ea580c; --sh5: #db2777; --sh6: #7c3aed; --sh7: #2563eb;
  --serif: "Amiri", "Noto Naskh Arabic", "Times New Roman", serif;
  --body: "IBM Plex Sans Arabic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: radial-gradient(85% 70% at 50% 42%, var(--bg-hi) 0%, var(--bg) 70%);
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  overflow: hidden;
  direction: rtl;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }

.panel {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: calc(16px + env(safe-area-inset-right, 0px));
  width: 300px;
  padding: 18px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 10px 30px rgba(20, 33, 61, 0.08);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: grid;
  gap: 14px;
}
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--muted); display: flex; justify-content: space-between; }
.ident { display: flex; align-items: center; gap: 16px; }
.sym {
  font-family: var(--mono); font-weight: 600; font-size: 54px; line-height: 1;
  color: var(--fg); direction: ltr;
  min-width: 2.4ch; text-align: center;
  padding: 10px 6px 6px; background: var(--bg-hi);
  border: 1px solid var(--line); border-top: 4px solid var(--c, var(--line)); border-radius: 4px;
  position: relative;
}
.sym::after { content: attr(data-z); position: absolute; top: 4px; left: 6px; font-size: 11px; font-weight: 400; color: var(--muted); }
.name { font-family: var(--serif); font-size: 32px; font-weight: 700; line-height: 1.1; text-wrap: balance; }
.mass { font-size: 13px; color: var(--muted); margin-top: 4px; }
.mass span, .stats dd { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.cat { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; color: #fff; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
.stats div { border-top: 1px solid var(--line); padding-top: 8px; }
.stats dt { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stats dd { margin: 2px 0 0; font-size: 22px; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.p { background: var(--proton); }
.dot.n { background: var(--neutron); }
.dot.e { background: conic-gradient(var(--sh1), var(--sh2), var(--sh3), var(--sh5), var(--sh1)); }
.block h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }
.mono { font-family: var(--mono); font-size: 14px; line-height: 1.6; word-break: break-word; }
#shells { direction: ltr; text-align: right; font-size: 17px; letter-spacing: 0.04em; color: var(--muted); }
#shells b { font-weight: 600; }
#conf sup { font-size: 0.7em; color: var(--sh1); }
.fact { font-size: 13.5px; line-height: 1.7; border-right: 3px solid var(--sh3); padding-right: 10px; }
.fact h3 { color: var(--sh3); font-weight: 600; }

.topbar {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: calc(16px + env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.brand svg { flex: none; }
.brand h1 { margin: 0; font-family: var(--serif); font-size: 28px; font-weight: 700; line-height: 1.1; color: var(--fg); }
.brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: flex-end; }
button {
  font: inherit; font-size: 13px; color: var(--fg); background: transparent;
  border: 0; padding: 8px 12px; cursor: pointer;
}
button:focus-visible, input:focus-visible { outline: 2px solid var(--sh1); outline-offset: 2px; }
.ctl { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
.ctl input[type="range"] { width: 110px; accent-color: var(--accent); }
.ctl button { padding: 4px 4px; }

.strip {
  position: fixed;
  left: 0; right: 0;
  bottom: 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin;
  background: linear-gradient(to top, rgba(244, 246, 251, 0.96), rgba(244, 246, 251, 0));
}
.cell {
  flex: none; width: 52px; height: 58px; padding: 4px 6px;
  border: 1px solid var(--line); border-top: 3px solid var(--c, var(--line)); border-radius: 4px; background: var(--bg-hi);
  display: grid; grid-template-rows: auto 1fr; text-align: left; direction: ltr;
  transition: border-color .2s, transform .2s, background .2s;
}
.cell small { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.cell strong { font-family: var(--mono); font-size: 20px; font-weight: 600; align-self: center; text-align: center; color: var(--c, var(--fg)); }
.cell:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(20, 33, 61, 0.1); }
.cell[aria-current="true"] { background: var(--c); border-color: var(--c); transform: translateY(-3px); box-shadow: 0 6px 16px rgba(20, 33, 61, 0.18); }
.cell[aria-current="true"] strong, .cell[aria-current="true"] small { color: #fff; }
.hint {
  position: fixed; margin: 0;
  left: calc(16px + env(safe-area-inset-left, 0px));
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  font-size: 12px; color: var(--muted);
}

@media (max-width: 720px) {
  .panel {
    left: calc(12px + env(safe-area-inset-left, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px));
    top: calc(12px + env(safe-area-inset-top, 0px));
    width: auto; padding: 12px 14px; gap: 10px;
    grid-template-columns: auto 1fr; align-items: center;
  }
  .eyebrow, .conf-block, .fact { display: none; }
  .sym { font-size: 34px; }
  .name { font-size: 22px; }
  .ident { grid-column: 1; }
  .stats { grid-column: 2; }
  .stats dd { font-size: 17px; }
  .stats dt { font-size: 10px; }
  .shell-block { grid-column: 1 / -1; display: flex; gap: 10px; align-items: baseline; }
  .shell-block h3 { margin: 0; }
  #shells { font-size: 14px; }
  .topbar { top: auto; left: calc(12px + env(safe-area-inset-left, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); align-items: stretch; }
  .brand { display: none; }
  .controls { justify-content: center; }
  .hint { display: none; }
}
</style>

<div id="stage" aria-label="نموذج ذرّة ثلاثي الأبعاد قابل للتدوير"></div>

<aside class="panel" aria-live="polite">

<div class="topbar">
  <header class="brand">
    <div>
      <h1>مختبر الذرّة</h1>

    </div>
    <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#14213d" stroke-width="1"><ellipse cx="12" cy="12" rx="10.5" ry="4"/><ellipse cx="12" cy="12" rx="10.5" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10.5" ry="4" transform="rotate(120 12 12)"/></g><circle cx="12" cy="12" r="1.9" fill="#14213d"/></svg>
  </header>
  <div class="controls">

      <label for="speed">السرعة</label>
      <input type="range" id="speed" min="0" max="3" step="0.05" value="1">

    </div>

<p class="hint">اسحب للتدوير · مرّر للتكبير · الأسهم ← → لتغيير العنصر</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  // ---------- Data ----------
  const CATS = {
    nonmetal: { name: 'لا فلز', c: '#16a34a' },
    noble: { name: 'غاز نبيل', c: '#7c3aed' },
    alkali: { name: 'فلز قلوي', c: '#dc2626' },
    alkaline: { name: 'فلز قلوي ترابي', c: '#ea580c' },
    metalloid: { name: 'شبه فلز', c: '#0d9488' },
    post: { name: 'فلز بعد انتقالي', c: '#475569' },
    halogen: { name: 'هالوجين', c: '#ca8a04' },
    transition: { name: 'فلز انتقالي', c: '#db2777' },
    actinide: { name: 'أكتينيد', c: '#65a30d' },
  };
  const ELEMENTS = [
    { z: 1, s: 'H', n: 'هيدروجين', N: 0, cat: 'nonmetal', f: 'أخف العناصر وأكثرها انتشاراً في الكون، ويكوّن نحو 75% من كتلة المادة العادية فيه.' },
    { z: 2, s: 'He', n: 'هيليوم', N: 2, cat: 'noble', f: 'لا يتجمد تحت الضغط العادي حتى قرب الصفر المطلق، ويُستخدم لتبريد مغناطيسات أجهزة الرنين المغناطيسي.' },
    { z: 3, s: 'Li', n: 'ليثيوم', N: 4, cat: 'alkali', f: 'أخف الفلزات على الإطلاق، وهو أساس بطاريات الجوالات والسيارات الكهربائية.' },
    { z: 6, s: 'C', n: 'كربون', N: 6, cat: 'nonmetal', f: 'أساس الكيمياء العضوية والحياة كلها، ومنه يتكوّن الألماس والجرافيت.' },
    { z: 7, s: 'N', n: 'نيتروجين', N: 7, cat: 'nonmetal', f: 'يكوّن نحو 78% من الهواء الذي نتنفسه.' },
    { z: 8, s: 'O', n: 'أكسجين', N: 8, cat: 'nonmetal', f: 'أكثر العناصر وفرة في القشرة الأرضية، ويكوّن نحو 21% من الهواء.' },
    { z: 10, s: 'Ne', n: 'نيون', N: 10, cat: 'noble', f: 'يعطي الضوء الأحمر البرتقالي المعروف في لافتات النيون.' },
    { z: 11, s: 'Na', n: 'صوديوم', N: 12, cat: 'alkali', f: 'فلز طري يُقطع بالسكين ويتفاعل بعنف مع الماء، وهو نصف ملح الطعام.' },
    { z: 12, s: 'Mg', n: 'مغنيسيوم', N: 12, cat: 'alkaline', f: 'يحترق بضوء أبيض ساطع، ويوجد في مركز جزيء الكلوروفيل في النباتات.' },
    { z: 13, s: 'Al', n: 'ألومنيوم', N: 14, cat: 'post', f: 'أكثر الفلزات وفرة في القشرة الأرضية، ومنه تُصنع علب المشروبات.' },
    { z: 14, s: 'Si', n: 'سيليكون', N: 14, cat: 'metalloid', f: 'أساس رقائق الحاسوب والألواح الشمسية، ويوجد في رمل الصحراء.' },
    { z: 17, s: 'Cl', n: 'كلور', N: 18, cat: 'halogen', f: 'غاز أصفر مخضر يُستخدم لتعقيم مياه الشرب، وهو النصف الآخر من ملح الطعام.' },
    { z: 18, s: 'Ar', n: 'أرغون', N: 22, cat: 'noble', f: 'ثالث أكثر غاز في الهواء بنسبة تقارب 1%، ويُملأ به بعض المصابيح.' },
    { z: 20, s: 'Ca', n: 'كالسيوم', N: 20, cat: 'alkaline', f: 'أساس العظام والأسنان، ويوجد بكثرة في الحجر الجيري.' },
    { z: 26, s: 'Fe', n: 'حديد', N: 30, cat: 'transition', f: 'معظم لبّ الأرض من الحديد، وهو في الهيموغلوبين الذي ينقل الأكسجين في دمك.' },
    { z: 29, s: 'Cu', n: 'نحاس', N: 35, cat: 'transition', f: 'من أفضل موصلات الكهرباء، ولذلك تُصنع منه معظم الأسلاك.' },
    { z: 47, s: 'Ag', n: 'فضة', N: 61, cat: 'transition', f: 'أعلى العناصر توصيلاً للكهرباء والحرارة.' },
    { z: 79, s: 'Au', n: 'ذهب', N: 118, cat: 'transition', f: 'لا يصدأ ولا يتآكل، ويمكن سحب غرام واحد منه إلى سلك طوله أكثر من كيلومترين.' },
    { z: 92, s: 'U', n: 'يورانيوم', N: 146, cat: 'actinide', f: 'أثقل عنصر يوجد في الطبيعة بكميات كبيرة، ويُستخدم وقوداً في محطات الطاقة النووية.' },
  ];
  // Real ground-state configurations that break the Aufbau order
  const EXCEPTIONS = { 29: { '3d': 10, '4s': 1 }, 47: { '4d': 10, '5s': 1 }, 79: { '5d': 10, '6s': 1 }, 92: { '5f': 3, '6d': 1 } };
  const ORDER = ['1s','2s','2p','3s','3p','4s','3d','4p','5s','4d','5p','6s','4f','5d','6p','7s','5f','6d','7p'];
  const CAP = { s: 2, p: 6, d: 10, f: 14 };
  const L = 'spdf';

  function configuration(z) {
    const map = new Map();
    let left = z;
    for (const o of ORDER) {
      if (left <= 0) break;
      const k = Math.min(CAP[o[1]], left);
      map.set(o, k); left -= k;
    }
    if (EXCEPTIONS[z]) for (const [o, k] of Object.entries(EXCEPTIONS[z])) map.set(o, k);
    return [...map].filter(([, k]) => k > 0)
      .map(([o, k]) => ({ o, n: +o[0], l: L.indexOf(o[1]), k }))
      .sort((a, b) => a.n - b.n || a.l - b.l);
  }

  // ---------- Scene ----------
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0xffffff, 0);
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 800);
  camera.position.set(6, 4, 14);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.enablePan = false;
  controls.minDistance = 3;
  controls.maxDistance = 140;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 0.95); key.position.set(5, 8, 6); scene.add(key);
  const rim = new THREE.DirectionalLight(0xc7d2fe, 0.45); rim.position.set(-6, -3, -6); scene.add(rim);

  function radialTexture(stops) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    stops.forEach(([p, a]) => gr.addColorStop(p, `rgba(255,255,255,${a})`));
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  const GLOW = radialTexture([[0, 1], [0.3, 0.55], [1, 0]]);

  function randomUnit() {
    const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    return new THREE.Vector3(s * Math.cos(t), s * Math.sin(t), u);
  }

  // ---------- Nucleus ----------
  const RS = 0.42;
  function packNucleus(A) {
    if (A === 1) return [[0, 0, 0]];
    const R0 = RS * 1.3 * Math.cbrt(A);
    const p = [];
    for (let i = 0; i < A; i++) {
      const v = randomUnit().multiplyScalar(R0 * Math.cbrt(Math.random()));
      p.push([v.x, v.y, v.z]);
    }
    const d0 = RS * 1.85;
    for (let it = 0; it < 45; it++) {
      for (let i = 0; i < A; i++) {
        const a = p[i];
        for (let j = i + 1; j < A; j++) {
          const b = p[j];
          const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
          const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          if (d < d0 && d > 1e-6) {
            const f = (d0 - d) * 0.5 / d;
            a[0] -= dx * f; a[1] -= dy * f; a[2] -= dz * f;
            b[0] += dx * f; b[1] += dy * f; b[2] += dz * f;
          }
        }
      }
      for (const q of p) { q[0] *= 0.97; q[1] *= 0.97; q[2] *= 0.97; }
    }
    return p;
  }

  // ---------- Atom build ----------
  const SPHERE = new THREE.SphereGeometry(RS, 24, 16);
  const CORE = new THREE.SphereGeometry(0.16, 16, 12);
  const TRAIL_PTS = 30, TRAIL_ARC = 1.1;
  const SHELL_COLORS = [0x0891b2, 0x16a34a, 0xd97706, 0xea580c, 0xdb2777, 0x7c3aed, 0x2563eb];
  const SHELL_CSS = ['--sh1', '--sh2', '--sh3', '--sh4', '--sh5', '--sh6', '--sh7'];
  const GROUND = new THREE.Color(0xf4f6fb); // trails fade into the page background
  let atom = null;

  function disposeTree(obj) {
    obj.traverse((o) => {
      if (o.geometry && o.geometry !== SPHERE && o.geometry !== CORE) o.geometry.dispose();
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
    });
  }

  function build(el) {
    if (atom) { scene.remove(atom.group); disposeTree(atom.group); }
    const conf = configuration(el.z);
    const A = el.z + el.N;
    const group = new THREE.Group();
    scene.add(group);

    // Nucleus as instanced spheres
    const pts = packNucleus(A);
    const order = pts.map((_, i) => i).sort(() => Math.random() - 0.5);
    const pMesh = new THREE.InstancedMesh(SPHERE, new THREE.MeshStandardMaterial({ color: 0xe11d48, emissive: 0x3a0412, roughness: 0.35, metalness: 0.05 }), el.z);
    const nMesh = el.N ? new THREE.InstancedMesh(SPHERE, new THREE.MeshStandardMaterial({ color: 0x2563eb, emissive: 0x06143a, roughness: 0.4, metalness: 0.05 }), el.N) : null;
    const nucleons = order.map((idx, k) => ({
      base: pts[idx], mesh: k < el.z ? pMesh : nMesh, i: k < el.z ? k : k - el.z,
      ph: Math.random() * Math.PI * 2, fr: 6 + Math.random() * 5,
    }));
    let rc = RS;
    for (const q of pts) rc = Math.max(rc, Math.hypot(q[0], q[1], q[2]) + RS);
    const nucleus = new THREE.Group();
    nucleus.add(pMesh); if (nMesh) nucleus.add(nMesh);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0xfb7185, transparent: true, opacity: 0.18, depthWrite: false }));
    halo.scale.setScalar(rc * 4 + 1.5);
    nucleus.add(halo);
    group.add(nucleus);

    // Bohr shells: electrons per principal level, big shells split into several orbital planes
    const shellCounts = [];
    conf.forEach((c) => { shellCounts[c.n - 1] = (shellCounts[c.n - 1] || 0) + c.k; });
    const radii = [];
    const bohr = new THREE.Group();
    group.add(bohr);
    const rings = [];
    let r = rc + 2.0;
    shellCounts.forEach((cnt, si) => {
      radii.push(r);
      const sc = new THREE.Color(SHELL_COLORS[si % SHELL_COLORS.length]);
      const ringCount = Math.ceil(cnt / 8);
      const pivot = new THREE.Group();
      pivot.rotation.set(si * 0.9 + 0.4, si * 2.39996, 0);
      pivot.userData.prec = 0.05 + 0.03 * si;
      bohr.add(pivot);
      for (let ri = 0; ri < ringCount; ri++) {
        const n = Math.floor(cnt / ringCount) + (ri < cnt % ringCount ? 1 : 0);
        const tilt = new THREE.Group();
        tilt.rotation.set(0, (ri / ringCount) * Math.PI, ri * 0.35);
        pivot.add(tilt);

        const circ = [];
        for (let a = 0; a <= 128; a++) { const t = a / 128 * Math.PI * 2; circ.push(new THREE.Vector3(Math.cos(t) * r, Math.sin(t) * r, 0)); }
        tilt.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(circ),
          new THREE.LineBasicMaterial({ color: sc, transparent: true, opacity: 0.35, depthWrite: false })));

        const electrons = [];
        for (let k = 0; k < n; k++) {
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: sc, transparent: true, opacity: 0.35, depthWrite: false }));
          sprite.scale.setScalar(0.9);
          const core = new THREE.Mesh(CORE, new THREE.MeshBasicMaterial({ color: sc }));
          const tg = new THREE.BufferGeometry();
          tg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_PTS * 3), 3));
          const col = new Float32Array(TRAIL_PTS * 3), c = new THREE.Color();
          for (let j = 0; j < TRAIL_PTS; j++) {
            c.copy(sc).lerp(GROUND, Math.pow(j / (TRAIL_PTS - 1), 0.7));
            col.set([c.r, c.g, c.b], j * 3);
          }
          tg.setAttribute('color', new THREE.BufferAttribute(col, 3));
          const trail = new THREE.Line(tg, new THREE.LineBasicMaterial({ vertexColors: true }));
          tilt.add(trail, sprite, core);
          electrons.push({ sprite, core, trail, off: (k / n) * Math.PI * 2 + ri * 0.6 });
        }
        rings.push({
          r, electrons,
          speed: 1.25 / Math.pow(si + 1, 0.75),
          dir: (si + ri) % 2 ? -1 : 1,
        });
      }
      r += 1.6;
    });
    const outerR = radii[radii.length - 1];

    atom = { el, conf, group, nucleons, pMesh, nMesh, bohr, rings, outerR, born: performance.now() };
    updatePanel();
    fitCamera();
  }

  // ---------- UI ----------
  let paused = false, speed = 1, current = 14;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) { speed = 0.3; controls.autoRotate = false; }
  const $ = (id) => document.getElementById(id);
  $('speed').value = speed;

  const strip = $('strip');
  ELEMENTS.forEach((el, i) => {
    const b = document.createElement('button');
    b.className = 'cell'; b.id = 'el-' + el.s;
    b.style.setProperty('--c', CATS[el.cat].c);
    b.innerHTML = `<small>${el.z}</small><strong>${el.s}</strong>`;
    b.title = el.n; b.setAttribute('aria-label', `${el.n}، العدد الذري ${el.z}`);
    b.addEventListener('click', () => select(i));
    strip.appendChild(b);
  });

  function select(i) {
    current = (i + ELEMENTS.length) % ELEMENTS.length;
    [...strip.children].forEach((b, k) => b.setAttribute('aria-current', k === current ? 'true' : 'false'));
    strip.children[current].scrollIntoView({ inline: 'center', block: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
    build(ELEMENTS[current]);
  }

  function updatePanel() {
    const { el, conf } = atom;
    $('zLbl').textContent = el.z;
    $('sym').textContent = el.s; $('sym').dataset.z = el.z;
    const cat = CATS[el.cat];
    $('sym').style.setProperty('--c', cat.c);
    $('cat').textContent = cat.name; $('cat').style.background = cat.c;
    $('fact').textContent = el.f;
    $('name').textContent = el.n;
    $('A').textContent = el.z + el.N;
    $('np').textContent = el.z; $('nn').textContent = el.N; $('ne').textContent = el.z;
    const shells = [];
    conf.forEach((c) => { shells[c.n - 1] = (shells[c.n - 1] || 0) + c.k; });
    $('shells').innerHTML = shells.map((s, i) => `<b style="color:var(${SHELL_CSS[i]})">${s}</b>`).join(' · ');
    $('conf').innerHTML = conf.map((c) => `${c.n}${L[c.l]}<sup>${c.k}</sup>`).join(' ');
  }

  $('speed').addEventListener('input', (e) => { speed = +e.target.value; });
  $('pause').addEventListener('click', () => {
    paused = !paused;
    $('pause').textContent = paused ? '▶' : '❚❚';
    $('pause').setAttribute('aria-label', paused ? 'تشغيل الحركة' : 'إيقاف الحركة');
    controls.autoRotate = !paused && !reduced;
  });
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') select(current + 1);
    if (e.key === 'ArrowRight') select(current - 1);
  });

  // ---------- Camera fit ----------
  let fit = null;
  function fitCamera() {
    const aspect = camera.aspect || 1;
    let d = atom.outerR * 2.7 + 4;
    if (aspect < 1) d /= Math.max(aspect, 0.5) * 1.05;
    fit = { from: camera.position.length(), to: d, t0: performance.now() };
  }
  controls.addEventListener('start', () => { fit = null; });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', () => { resize(); if (atom) fitCamera(); });
  resize();

  // ---------- Loop ----------
  const M = new THREE.Matrix4();
  let last = performance.now(), t = 0;
  const easeOutBack = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; };

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const step = paused ? 0 : dt * speed;
    t += step;

    if (atom) {
      const age = Math.min(1, (now - atom.born) / 900);
      atom.group.scale.setScalar(Math.max(0.001, easeOutBack(age)));

      // nucleon vibration
      const amp = 0.035;
      for (const q of atom.nucleons) {
        const ph = q.ph + t * q.fr;
        M.makeTranslation(q.base[0] + Math.sin(ph) * amp, q.base[1] + Math.cos(ph * 1.3) * amp, q.base[2] + Math.sin(ph * 0.7) * amp);
        q.mesh.setMatrixAt(q.i, M);
      }
      atom.pMesh.instanceMatrix.needsUpdate = true;
      if (atom.nMesh) atom.nMesh.instanceMatrix.needsUpdate = true;

      atom.bohr.children.forEach((pivot) => { pivot.rotation.y += step * pivot.userData.prec * 4; });
      for (const ring of atom.rings) {
        const r = ring.r;
        for (const e of ring.electrons) {
          const th = e.off + t * ring.speed * ring.dir;
          const x = Math.cos(th) * r, y = Math.sin(th) * r;
          e.sprite.position.set(x, y, 0); e.core.position.set(x, y, 0);
          const arr = e.trail.geometry.attributes.position.array;
          for (let j = 0; j < TRAIL_PTS; j++) {
            const a = th - ring.dir * (j / (TRAIL_PTS - 1)) * TRAIL_ARC;
            arr[j * 3] = Math.cos(a) * r; arr[j * 3 + 1] = Math.sin(a) * r; arr[j * 3 + 2] = 0;
          }
          e.trail.geometry.attributes.position.needsUpdate = true;
        }
      }
    }

    if (fit) {
      const k = Math.min(1, (now - fit.t0) / 1200);
      const e = 1 - Math.pow(1 - k, 3);
      camera.position.setLength(fit.from + (fit.to - fit.from) * e);
      if (k >= 1) fit = null;
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // Open the element named in the link's #anchor (e.g. #Fe, #U)
  function fromHash() {
    const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    return ELEMENTS.findIndex((el) => el.s.toLowerCase() === h);
  }
  window.addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0) select(i); });
  const initial = fromHash();
  if (initial >= 0) current = initial;

  select(current);
  requestAnimationFrame(frame);
})();
</script>
